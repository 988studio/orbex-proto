    <!-- Prototype (R1 fix 7): dark by default, set before the first paint (?theme=, then the saved View mode, else dark) -->
    <script>
      (function () {
        var t = 'dark'
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var s = localStorage.getItem('sonar-ds-theme')
          t = q === 'dark' || q === 'light' ? q : s === 'light' || s === 'dark' ? s : 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = t
        /* Round 2: the device before the first paint (v38 modeOf), so a phone's page can scroll from the start */
        var d = new URLSearchParams(location.search).get('device')
        var w = window.innerWidth
        document.documentElement.dataset.protoDevice = d === 'desktop' || d === 'tablet' || d === 'phone' ? d : d === 'mobile' ? 'phone' : w < 768 ? 'phone' : w < 1280 ? 'tablet' : 'desktop'
        /* DS 1.1.1: the floating bottom bar is the phone's only bar. The Nav A/B switch (?nav=, «orbex-proto-nav») is gone;
           a value left from it is cleared and nothing reads it */
        try { localStorage.removeItem('orbex-proto-nav') } catch (e) {}
      })()
    </script>
